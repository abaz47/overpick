services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: overpick
      POSTGRES_USER: overpick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overpick -d overpick"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://overpick:${POSTGRES_PASSWORD}@db:5432/overpick
    ports:
      - "127.0.0.1:8040:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
