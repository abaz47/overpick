{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      {% block title %}
        OverPick
      {% endblock title %}
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <style>
      .prob-hot { font-weight: 600; color: #0a58ca; }
      .table td, .table th { vertical-align: middle; }
    </style>
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand fw-semibold"
           href="{% url 'picks' %}">OverPick</a>
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navMain"
                aria-controls="navMain"
                aria-expanded="false"
                aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
          <div class="navbar-nav">
            <a class="nav-link
                      {% if request.resolver_match.url_name == 'picks' %}active{% endif %}"
               href="{% url 'picks' %}">Today</a>
            <a class="nav-link
                      {% if request.resolver_match.url_name == 'picks_tomorrow' %}active{% endif %}"
               href="{% url 'picks_tomorrow' %}">Tomorrow</a>
            <a class="nav-link
                      {% if request.resolver_match.url_name == 'history' %}active{% endif %}"
               href="{% url 'history' %}">History</a>
          </div>
        </div>
      </div>
    </nav>
    <main class="container pb-5">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags|default:'info' }}"
               role="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
      {% block content %}
      {% endblock content %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
  </body>
</html>
