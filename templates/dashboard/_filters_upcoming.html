<form method="get" class="row g-2 align-items-end mb-3">
  <div class="col-6 col-md-2">
    <label class="form-label small mb-1" for="hours">Window</label>
    <select class="form-select form-select-sm" name="hours" id="hours">
      <option value="3"
              {% if hours == "3" %}selected{% endif %}>Next 3h</option>
      <option value="6"
              {% if hours == "6" %}selected{% endif %}>Next 6h</option>
      <option value="9"
              {% if hours == "9" %}selected{% endif %}>Next 9h</option>
      <option value="12"
              {% if hours == "12" %}selected{% endif %}>Next 12h</option>
      <option value="24"
              {% if hours == "24" %}selected{% endif %}>Next 24h</option>
      <option value="48"
              {% if hours == "48" %}selected{% endif %}>Next 48h</option>
    </select>
  </div>
  <div class="col-6 col-md-2">
    <label class="form-label small mb-1" for="market">Signal market</label>
    <select class="form-select form-select-sm" name="market" id="market">
      <option value="o15"
              {% if market == "o15" %}selected{% endif %}>O1.5</option>
      <option value="o25"
              {% if market == "o25" %}selected{% endif %}>O2.5</option>
      <option value="o35"
              {% if market == "o35" %}selected{% endif %}>O3.5</option>
    </select>
  </div>
  <div class="col-12 col-md-4">
    <label class="form-label small mb-1" for="league">League</label>
    <select class="form-select form-select-sm" name="league" id="league">
      <option value="">All leagues</option>
      {% for lg in leagues %}
        <option value="{{ lg.api_id }}"
                {% if league_api_id == lg.api_id %}selected{% endif %}>
          {{ lg.country }} — {{ lg.name }}
        </option>
      {% endfor %}
    </select>
  </div>
  <div class="col-6 col-md-2">
    <div class="form-check mt-4">
      <input class="form-check-input"
             type="checkbox"
             name="signals"
             value="1"
             id="signals"
             {% if signals_only %}checked{% endif %}>
      <label class="form-check-label small" for="signals">Signals only</label>
    </div>
  </div>
  <div class="col-6 col-md-2">
    <button type="submit" class="btn btn-sm btn-primary w-100">Apply</button>
  </div>
</form>
